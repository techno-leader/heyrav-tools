<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Paper Pixel Bench - heyrav tools</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css?v=b7e2e0c138">
<style>
  /* palette */
  .pal{display:flex;flex-wrap:wrap;gap:6px;}
  .pal .pc{position:relative;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--c,#fff);padding:0;}
  .pal .pc[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px;}
  .pal .pc b{position:absolute;right:2px;bottom:1px;font:600 10px/1 var(--mono);color:#fff;text-shadow:0 0 2px #000,0 0 1px #000;}
  .pal .pc.erase{background:repeating-conic-gradient(#e9e9e9 0 25%,#fff 0 50%) 0 0/10px 10px;}
  .pal .pc.add{background:var(--wash);font:500 18px/1 var(--sans);color:var(--ink-2);}
  .pal-edit{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .pal-edit input[type=color]{width:40px;height:30px;border:1px solid var(--line);border-radius:var(--r-xs);padding:0;background:none;}

  /* layers */
  .layers{display:grid;gap:2px;max-height:240px;overflow:auto;}
  .ly{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;min-height:34px;padding:0 8px 0 2px;border-radius:var(--r-sm);font-size:13px;color:var(--ink);cursor:default;user-select:none;}
  .ly:hover{background:var(--wash);}
  .ly[aria-selected="true"]{background:#e8f0ff;color:#123a8c;}
  .ly .eye{width:26px;height:26px;padding:0;border:0;background:none;color:var(--ink-3);border-radius:var(--r-xs);display:grid;place-items:center;}
  .ly .eye svg{width:15px;height:15px;fill:currentColor;}
  .ly.off .nm{opacity:.4;}
  .ly .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ly .nm input{width:100%;font:inherit;border:1px solid var(--ink);border-radius:4px;padding:2px 4px;}
  .ly small{font:11px var(--mono);color:var(--mut);}
  .ly[aria-selected="true"] small{color:#3b5fb0;}
  .lytools{display:flex;gap:4px;margin-top:8px;}
  .lytools button{flex:1;min-height:32px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);font:inherit;font-size:12px;color:var(--ink-2);}
  @media (hover:hover) and (pointer:fine){.lytools button:hover{border-color:var(--ink-3);color:var(--ink);}}

  /* the inspector: rows of scrub fields */
  .insp{display:grid;gap:7px;}
  .ish{margin:10px 0 2px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);}
  .ish:first-child{margin-top:0;}
  .ir{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:6px;}
  .ir[hidden]{display:none;}
  .ir > .il{font-size:12px;color:var(--mut);white-space:nowrap;}
  .if{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:4px;}
  .sf{display:flex;align-items:center;height:30px;min-width:0;border-radius:6px;background:var(--wash);border:1px solid transparent;}
  .sf:focus-within{border-color:var(--ink);background:var(--paper);}
  .sf b{flex:none;align-self:stretch;display:grid;place-items:center;min-width:22px;padding:0 4px;font:600 11px/1 var(--mono);color:var(--ink-3);cursor:ew-resize;user-select:none;touch-action:none;border-radius:6px 0 0 6px;}
  @media (hover:hover) and (pointer:fine){.sf b:hover{background:rgba(0,0,0,.05);}}
  .sf input{flex:1;width:100%;min-width:0;height:100%;border:0;background:none;padding:0 6px 0 2px;font:13px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;}
  .sf input:focus{outline:none;}
  .sf select{flex:1;min-width:0;height:100%;border:0;background:none;font:13px var(--sans);color:var(--ink);padding:0 4px;}
  .ir .seg{margin-top:0;}
  .ir .seg button{min-height:30px;font-size:12px;}
  .sw2{display:flex;gap:14px;}
  .sw2 .tgl{min-height:30px;gap:8px;font-size:12px;color:var(--ink-2);}
  .insp .hint{font-size:11.5px;line-height:1.45;color:var(--mut);margin-top:6px;}
  body.scrubbing,body.scrubbing *{cursor:ew-resize!important;user-select:none!important;}

  /* the viewport's own toolbar */
  .vbar{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:6px;align-items:center;padding:4px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px -10px rgba(0,0,0,.35);border:1px solid var(--line);}
  .vbar button{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:none;font:inherit;font-size:12.5px;color:var(--ink-2);}
  .vbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  .vbar kbd{font:10.5px var(--mono);opacity:.6;}
  .vbar i{width:1px;height:18px;background:var(--line);}
  @media (hover:hover) and (pointer:fine){.vbar button:not([aria-pressed="true"]):hover{background:var(--wash);color:var(--ink);}}
</style>
</head>
<body>
<div class="tool">
  <aside class="rail" aria-label="Controls"></aside>
  <main class="stage"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kit.js?v=96f7f68aa7"></script>
<script src="paper-pixel.js?v=47ae0fac48"></script>
<script src="paper-assets.js?v=6dbcb65179"></script>
<script>
/* Paper Pixel Bench - draw a pixel grid for each piece of a plant or prop,
   then place it in 3D the way a scene editor works: click a piece in the
   view to select it, drag it or its handles to move and turn it, drag empty
   space to orbit, scroll to zoom; every number in the inspector can be
   dragged by its label. The engine is the one the Paper Pixel world loads,
   so what is built here is what the site shows. */

const PP = window.PaperPixel, LIB = window.PaperPixelAssets, h = Kit.h;
const clone = o => JSON.parse(JSON.stringify(o));
let eng = null; try { eng = PP.create(THREE); } catch (e) { console.error(e); }
const BG = [['#ffffff','paper'],['#f6f3ec','cream'],['#efe9dc','kraft light'],['#1b1a17','ink'],['#a3daff','sky'],['#111638','night']];
const AXC = { x: '#e5484d', y: '#30a46c', z: '#3e63dd' };
const EYE = '<svg viewBox="0 0 256 256"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 256 256"><path d="M53.92,34.62A8,8,0,1,0,42.08,45.38L61.32,66.55C25,88.84,9.38,123.2,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208a127.11,127.11,0,0,0,52.07-10.83l22,24.21a8,8,0,1,0,11.84-10.76Zm47.33,75.84,41.67,45.85a32,32,0,0,1-41.67-45.85ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.16,133.16,0,0,1,25,128c4.69-8.79,19.66-33.39,47.35-49.38l18,19.75a48,48,0,0,0,63.66,70l14.73,16.2A112,112,0,0,1,128,192Zm6-95.43a8,8,0,0,1,3-15.72,48.16,48.16,0,0,1,38.77,42.64,8,8,0,0,1-7.22,8.71,6.39,6.39,0,0,1-.75,0,8,8,0,0,1-8-7.26A32.09,32.09,0,0,0,134,96.57Zm113.28,34.69c-.42.94-10.55,23.37-33.36,43.8a8,8,0,1,1-10.67-11.92A132.77,132.77,0,0,0,231.05,128a133.15,133.15,0,0,0-23.12-30.77C185.67,75.19,158.78,64,128,64a118.37,118.37,0,0,0-19.36,1.57A8,8,0,1,1,106,49.79,134,134,0,0,1,128,48c34.88,0,66.57,13.26,91.66,38.35,18.83,18.83,27.3,37.62,27.65,38.41A8,8,0,0,1,247.31,131.26Z"/></svg>';

/* ---- a random plant, for R ---- */
function randomPlant() {
  const r = Math.random, pick = a => a[Math.floor(r() * a.length)];
  const greens = [['#8fcf6a','#4f9a3f','#2f6b2c'],['#a8d39a','#5f9d63','#3a6b44'],['#a9c66a','#6f8f36','#46622a']];
  const blooms = [['#f25a52','#c93a4c','#d867a2'],['#f7a0b8','#dd6d92','#b46cc4'],['#ffcf4a','#e8a020','#f08a3c'],['#8fb8ff','#5b7fe0','#9b7ae8'],['#ffffff','#e9e4f2','#f2b8c6']];
  const g = pick(greens), b = pick(blooms), H = 16 + Math.floor(r() * 16);
  const palette = [g[0], g[1], g[2], b[0], b[1], b[2]];
  const stem = []; let x = 1;
  for (let y = 0; y < H; y++) { if (y > 2 && y % (5 + Math.floor(r() * 4)) === 0) x = Math.max(0, Math.min(2, x + (r() < .5 ? -1 : 1))); stem.push(x); }
  const stemRows = []; for (let y = H - 1; y >= 0; y--) { const row = ['.', '.', '.', '.']; row[stem[y]] = '1'; row[stem[y] + 1] = r() < .15 ? '3' : '2'; stemRows.push(row.join('')); }
  const leaf = len => { const rows = []; const hgt = Math.ceil(len * .8) + 3; for (let yy = 0; yy < hgt; yy++) rows.push('.'.repeat(len).split('')); for (let i = 0; i < len; i++) { const w = Math.max(1, Math.round(3 * Math.sin(Math.PI * Math.min(1, .12 + i / (len - 1) * .95)))); const y0 = Math.round(i * .8); for (let k = 0; k < w; k++) { const yy = hgt - 1 - (y0 + k - Math.floor((w - 1) / 2) + 1); if (rows[yy]) rows[yy][i] = k === Math.floor(w / 2) && i > 0 && i < len - 2 ? '2' : '1'; } } return rows.map(r2 => r2.join('')); };
  const kind = pick(['cup', 'star', 'drop']);
  const head = kind === 'cup' ? ['4...4...4', '44.444.44', '444444444', '544444445', '.5544455.', '..65556..', '...666...']
    : kind === 'star' ? ['...4...', '..444..', '4444444', '.44544.', '4444444', '..444..', '...4...']
    : ['..44..', '.4444.', '444444', '445544', '.4554.', '..66..'];
  const lw = 7 + Math.floor(r() * 5);
  return { v: 1, name: 'Wild ' + pick(['bloom', 'stalk', 'bud', 'sprig', 'flower']), kind: 'plant', tilt: 24, palette, pieces: [
    PP.piece({ name: 'stem', rows: stemRows, ax: stem[0] + 1, grow: 'stem', dur: .7 }),
    PP.piece({ name: 'leaf', rows: leaf(lw), ax: 0, ay: 1, y: 3 + Math.floor(r() * 4), ry: Math.round(35 + r() * 25), grow: 'fold', delay: .35, flex: 1 }),
    PP.piece({ name: 'leaf', rows: leaf(lw - 2).map(row => [...row].reverse().join('')), ax: lw - 3, ay: 1, y: 6 + Math.floor(r() * 5), ry: Math.round(-30 - r() * 25), grow: 'fold', delay: .45, flex: 1 }),
    PP.piece({ name: 'head', rows: head, ax: Math.floor(head[0].length / 2), x: stem[H - 1] - 1, y: H, repeat: kind === 'star' ? 2 : 3, step: kind === 'star' ? 90 : 60, grow: 'fold', delay: .55, flex: .3, role: 'petal' }),
  ] };
}

/* ---- state helpers ---- */
const A = S => S.asset;
const P = S => A(S).pieces[Math.min(S.sel, A(S).pieces.length - 1)] || null;
function editAsset(api, fn, commit = true) { const a = clone(api.S.asset); fn(a); api.set('asset', a); if (commit) api.commit('asset'); }
function editPiece(api, fn, commit = true) { editAsset(api, a => { const i = Math.min(api.S.sel, a.pieces.length - 1); if (i >= 0) a.pieces[i] = fn(PP.piece(a.pieces[i])); }, commit); }
const hidden = new Set();   // layers hidden in the view only - never saved
let shift = false, alt = false;
addEventListener('keydown', e => { shift = e.shiftKey; alt = e.altKey; });
addEventListener('keyup', e => { shift = e.shiftKey; alt = e.altKey; });

/* ---- model cache ---- */
let mKey = '', model = null, unfoldAt = 0, bloomAt = -9, blowAt = -9, shakeAt = -9;
function getModel(S) {
  const k = JSON.stringify(S.asset);
  if (k !== mKey && eng) { if (model) eng.dispose(model); model = eng.model(S.asset); mKey = k; }
  return model;
}

/* ---- the stage: grid on one side, the 3D view on the other ---- */
let L = null;
function layout(W, H, S) {
  const side = S.view === 'split' && W >= 720, stack = S.view === 'split' && W < 720;
  H -= 76; // the dock floats over the bottom of the stage
  const gridR = S.view === 'preview' ? null : side ? { x: 0, y: 0, w: W * .4, h: H } : stack ? { x: 0, y: 0, w: W, h: H * .42 } : { x: 0, y: 0, w: W, h: H };
  const prevR = S.view === 'grid' ? null : side ? { x: W * .4, y: 0, w: W * .6, h: H } : stack ? { x: 0, y: H * .42, w: W, h: H * .58 } : { x: 0, y: 0, w: W, h: H };
  return { gridR, prevR };
}
let hover = null, kcur = { x: 0, y: 0 };
function gridGeom(S) {
  const p = P(S); if (!p || !L || !L.gridR) return null;
  const { w, h } = PP.size(p), R = L.gridR, pad = 44;
  const c = Math.max(4, Math.floor(Math.min((R.w - pad * 2) / Math.max(w, 1), (R.h - pad * 2 - 30) / Math.max(h, 1), 36)));
  return { p, w, h, c, x0: R.x + (R.w - c * w) / 2, y0: R.y + (R.h - c * h) / 2 + 6 };
}
const isDark = hex => { const n = parseInt(hex.slice(1), 16); return (.2126 * (n >> 16 & 255) + .7152 * (n >> 8 & 255) + .0722 * (n & 255)) / 255 < .4; };

function drawGrid(ctx, S) {
  const G = gridGeom(S); if (!G) return;
  const { p, w, h, c, x0, y0 } = G, pal = A(S).palette, dark = isDark(S.bg);
  ctx.save();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = (p.rows[y] || '')[x] || '.', k = PP.CH.indexOf(ch);
    if (k >= 0) { ctx.fillStyle = pal[k] || '#f0f'; ctx.fillRect(x0 + x * c, y0 + y * c, c, c); }
    else { ctx.fillStyle = ((x + y) & 1) ? (dark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.035)') : (dark ? 'rgba(255,255,255,.02)' : 'rgba(0,0,0,.012)'); ctx.fillRect(x0 + x * c, y0 + y * c, c, c); }
  }
  ctx.strokeStyle = dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= w; x++) { ctx.moveTo(x0 + x * c + .5, y0); ctx.lineTo(x0 + x * c + .5, y0 + h * c); }
  for (let y = 0; y <= h; y++) { ctx.moveTo(x0, y0 + y * c + .5); ctx.lineTo(x0 + w * c, y0 + y * c + .5); }
  ctx.stroke();
  const ax = p.ax == null ? Math.floor(w / 2) : p.ax, ay = p.ay || 0;
  const px = x0 + (ax + .5) * c, py = y0 + (h - 1 - ay + .5) * c;
  ctx.strokeStyle = '#e8472f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(px - c * .6, py); ctx.lineTo(px + c * .6, py); ctx.moveTo(px, py - c * .6); ctx.lineTo(px, py + c * .6); ctx.stroke();
  ctx.beginPath(); ctx.arc(px, py, c * .32, 0, Math.PI * 2); ctx.stroke();
  if (S.mirror) { ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(232,71,47,.6)'; ctx.beginPath(); ctx.moveTo(px, y0 - 8); ctx.lineTo(px, y0 + h * c + 8); ctx.stroke(); ctx.setLineDash([]); }
  const hc = hover || (document.activeElement === T.canvas ? kcur : null);
  if (hc && hc.x >= 0 && hc.y >= 0 && hc.x < w && hc.y < h) { ctx.strokeStyle = dark ? '#fff' : '#161616'; ctx.lineWidth = 2; ctx.strokeRect(x0 + hc.x * c + 1, y0 + hc.y * c + 1, c - 2, c - 2); }
  ctx.fillStyle = dark ? 'rgba(255,255,255,.62)' : 'rgba(0,0,0,.55)'; ctx.font = '500 12px Onest, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${p.name || 'piece'}  ·  ${w} × ${h}  ·  ${S.brush}${S.mirror ? ' · mirrored' : ''}  ·  ⌥-click sets the pivot`, L.gridR.x + L.gridR.w / 2, y0 + h * c + 24);
  ctx.restore();
}

/* ---- the 3D view ---- */
let VS = null, fitU = 6;   // the last view state, for picking and handles
function viewState(S, t) {
  const R = L.prevR, m = getModel(S), k = T.view.scale * T.view.dpr, b = eng.bounds(m);
  fitU = Math.max(1, Math.min((R.w - 40) / b.w, (R.h - 60) / b.h));
  const u = S.zoom === 0 ? fitU : S.zoom;
  const prog = S.unfold ? Math.min(1, (t - unfoldAt) / 1.5) : 1;
  return { k, R, uCss: u, b, u: u * k, w: Math.round(R.w * k), h: Math.round(R.h * k), x: R.x, y: R.y, dw: R.w, dh: R.h,
    base: ((R.h - b.h * u) / 2 + b.base * u) / u, prog, t: S.sway ? t : 0, sway: S.sway ? 1 : 0, still: !S.sway && prog >= 1,
    yaw: S.yaw + (S.spin ? t * S.spin * 30 : 0), tilt: S.tilt, bloom: Math.max(0, 1 - (t - bloomAt) * .6), blow: t - blowAt < 2.6 ? (t - blowAt) * .45 : 0,
    flap: S.flap / 100, shake: Math.max(0, 1 - (t - shakeAt) * 1.4), flat: !S.light, clear: false,
    hi: A(S).pieces.length > 1 ? Math.min(S.sel, A(S).pieces.length - 1) : null, hide: hidden };
}
let GZ = null, hot = null, hoverPi = -1;   // handle geometry in stage units, the handle under the pointer
function drawPreview(ctx, S, t) {
  const R = L.prevR; if (!R || !eng) return;
  const m = getModel(S); if (!m) return;
  const st = VS = viewState(S, t);
  ctx.save();
  if (S.shadow && 'filter' in ctx) ctx.filter = 'drop-shadow(5px 9px 5px rgba(52,38,22,.18)) drop-shadow(1px 2px 1px rgba(52,38,22,.14))';
  eng.draw(m, ctx, st);
  ctx.restore();
  const gy = R.y + R.h - st.base * st.uCss;
  ctx.strokeStyle = isDark(S.bg) ? 'rgba(255,255,255,.14)' : 'rgba(0,0,0,.1)'; ctx.beginPath(); ctx.moveTo(R.x + 24, gy + .5); ctx.lineTo(R.x + R.w - 24, gy + .5); ctx.stroke();
  drawGizmo(ctx, S, m, st);
  ctx.fillStyle = isDark(S.bg) ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.42)'; ctx.font = '500 11.5px Onest, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Click a piece to select · drag it or a handle · drag empty space to orbit · scroll to zoom · double-click to reset', R.x + 18, R.y + R.h - 14);
}
function drawGizmo(ctx, S, m, st) {
  GZ = null;
  if (!S.handles || st.hi == null && A(S).pieces.length > 1) return;
  const pi = Math.min(S.sel, A(S).pieces.length - 1);
  if (hidden.has(pi)) return;
  const ringCells = 46 / st.uCss;
  const g = eng.gizmo(m, st, pi, ringCells); if (!g) return;
  const k = st.k, X = v => st.x + v / k, Y = v => st.y + v / k;
  const o = [X(g.o[0]), Y(g.o[1])];
  GZ = { o, mode: S.gmode, ax: {}, ring: {}, toward: g.toward, axDev: {}, k };
  ctx.save(); ctx.lineCap = 'round';
  if (S.gmode === 'move') {
    for (const a of ['x', 'y', 'z']) {
      const d = g.ax[a], len = Math.hypot(d[0], d[1]); GZ.axDev[a] = [d[0] / k, d[1] / k];
      if (len < 1e-3) continue;
      const L2 = 58, e = [o[0] + d[0] / len * L2, o[1] + d[1] / len * L2];
      GZ.ax[a] = e;
      const on = hot === a || (drag && drag.axis === a);

      { k:'mirror', type:'toggle', label:'mirror round the pivot', value:false, rand:false },
    ]},
    { name: 'asset', closed: true, controls: [
      { type:'custom', render: api => {
          const el = h('div', { class: 'insp' });
          const name = h('input', { type: 'text', spellcheck: 'false', 'aria-label': 'asset name' });
          name.addEventListener('change', () => editAsset(api, a => { a.name = name.value.trim() || 'Untitled'; }));
          const kind = h('div', { class: 'seg', role: 'group', 'aria-label': 'kind' }, ['plant', 'prop'].map(v => h('button', { type: 'button', 'data-v': v, onclick: () => editAsset(api, a => { a.kind = v; }) }, v)));
          const tilt = h('input', { type: 'text', inputmode: 'decimal', 'aria-label': 'tilt' });
          tilt.addEventListener('change', () => { const v = num(tilt.value); if (v != null) editAsset(api, a => { a.tilt = Math.max(-10, Math.min(80, v)); }); });
          el.append(row('Name', h('label', { class: 'sf' }, name)), row('Kind', kind), row('Tilt', fields(1, h('label', { class: 'sf' }, h('b', {}, '°'), tilt))));
          el._f = { name, kind, tilt }; return el;
        }, sync: (S, el) => { const f = el._f, a = A(S); if (document.activeElement !== f.name) f.name.value = a.name || ''; f.kind.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === (a.kind || 'plant')))); if (document.activeElement !== f.tilt) f.tilt.value = a.tilt == null ? 24 : a.tilt; },
        help: 'Tilt is how far the site looks down on it. Plants stand on a line on the page; props sit on it.' },
    ]},
    { name: 'view', controls: [
      { k:'view', type:'seg', label:'stage', value:'split', options:[['split','grid + 3D'],['grid','grid'],['preview','3D']], rand:false },
      { k:'snap', type:'toggle', label:'snap - half cells, 15°', value:true, rand:false, help:'Hold Shift while dragging to do the opposite.' },
      { k:'handles', type:'toggle', label:'handles on the selected piece', value:true, rand:false },
      { k:'bg', type:'color', label:'paper', value:'#ffffff', options:BG, rand:false },
      { k:'zoom', type:'range', label:'cell size', min:0, max:48, step:.5, value:0, fmt:v => v === 0 ? 'fit' : v + ' px', rand:false, help:'Scroll over the view to zoom. The site shows plants at 3-7 px a cell.' },
      { k:'yaw', type:'range', label:'orbit', min:-180, max:180, value:-20, unit:'°', rand:false },
      { k:'tilt', type:'range', label:'look down', min:-10, max:80, value:24, unit:'°', rand:false },
      { k:'spin', type:'range', label:'turntable', min:0, max:2, step:.05, value:0, rand:false },
      { k:'sway', type:'toggle', label:'sway', value:true, rand:false },
      { k:'light', type:'toggle', label:'light and shade', value:true, rand:false },
      { k:'shadow', type:'toggle', label:'shadow on the page', value:true, rand:false },
      { k:'unfold', type:'toggle', label:'unfold on change', value:true, rand:false },
      { k:'flap', type:'range', label:'flaps open', min:0, max:100, value:100, unit:'%', rand:false, when: S => A(S).pieces.some(p => p.role === 'flap') },
      { type:'buttons', buttons:[
        { label:'Unfold', run: api => { unfoldAt = api.clock.t; if (!api.clock.on) api.clock.start(); } },
        { label:'Bloom', run: api => { bloomAt = api.clock.t; blowAt = api.clock.t; if (!api.clock.on) api.clock.start(); } },
        { label:'Shake', run: api => { shakeAt = api.clock.t; if (!api.clock.on) api.clock.start(); } } ] },
    ]},
    { name: 'export', controls: [
      { type:'buttons', buttons:[
        { label:'Copy JSON', primary:true, run: api => api.copy(JSON.stringify(PP.tidy(A(api.S))), 'asset JSON copied') },
        { label:'Copy link', run: api => api.link() } ] },
      { type:'buttons', buttons:[
        { label:'Copy for the site', run: api => { const a = PP.tidy(A(api.S)), key = (a.name || 'asset').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            api.copy(`PaperPixelAssets[${JSON.stringify(key)}] = ${JSON.stringify(a)};`, 'site snippet copied'); } },
        { label:'Download', run: api => { const a = PP.tidy(A(api.S)); api.download(new Blob([JSON.stringify(a, null, 1)], { type: 'application/json' }), (a.name || 'asset').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.paper.json'); api.toast('JSON saved'); } },
        { label:'PNG', run: api => api.png(2, (A(api.S).name || 'asset').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png') } ] },
      { type:'file', label:'open an asset', accept:'.json,application/json', prompt:'drop a .paper.json here', sub:'or click to choose',
        onFile: async (f, api) => { try { const a = JSON.parse(await f.text()); if (!a.pieces || !a.palette) throw 0; hidden.clear(); api.set('asset', a); api.set('sel', 0); api.commit('asset'); unfoldAt = api.clock.t; api.toast('opened ' + (a.name || 'asset')); } catch { api.toast('that file is not a Paper Pixel asset'); } } },
      { type:'note', text:'Copy JSON or the link to share a piece; the site reads the same JSON. Copy for the site gives a line that adds it to the asset library.' },
    ]},
  ],
  onPointer: (ptr, kind, S) => {
    const c = cellAt(S, ptr.x, ptr.y);
    hover = c && c.inside ? { x: c.x, y: c.y } : null;
    if (kind === 'down') {
      if (hover) { stroke = true; paintAt(S, hover.x, hover.y); kcur = { ...hover }; }
      else if (inPrev(ptr.x, ptr.y)) startDrag(S, ptr.x, ptr.y);
    } else if (kind === 'move') {
      if (ptr.down) {
        if (stroke && hover && S.brush !== 'fill' && !alt) paintAt(S, hover.x, hover.y);
        if (drag) moveDrag(S, ptr.x, ptr.y);
      } else if (inPrev(ptr.x, ptr.y)) {
        hot = handleAt(ptr.x, ptr.y);
        hoverPi = hot ? -1 : pickAt(S, ptr.x, ptr.y);
      } else { hot = null; hoverPi = -1; }
    }
    T.canvas.style.cursor = hover ? (alt ? 'cell' : S.brush === 'pick' ? 'copy' : 'crosshair')
      : drag ? (drag.type === 'orbit' ? 'grabbing' : 'move')
      : hot ? (GZ && GZ.mode === 'rotate' ? 'alias' : 'move') : hoverPi >= 0 ? 'pointer' : inPrev(ptr.x, ptr.y) ? 'grab' : '';
  },
  draw: (ctx, W, H, t, S) => {
    L = layout(W, H, S);
    ctx.fillStyle = S.bg; ctx.fillRect(0, 0, W, H);
    if (L.gridR && L.prevR) { ctx.fillStyle = isDark(S.bg) ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.025)'; if (W >= 720) ctx.fillRect(L.gridR.x, 0, L.gridR.w, H); else ctx.fillRect(0, 0, W, L.gridR.h); }
    drawGrid(ctx, S);
    drawPreview(ctx, S, t);
    if (!eng) { ctx.fillStyle = '#e8472f'; ctx.font = '500 14px Onest'; ctx.fillText('This browser could not start WebGL, so the 3D view is off.', 24, H - 24); }
  },
});

/* a new asset or a preset unfolds from flat */
let lastName = '';
T.on((k, S) => {
  if ((k === 'preset' || k === '*' || k === 'asset') && S.unfold) { const n = A(S).name + A(S).pieces.length; if (k !== 'asset' || n !== lastName) unfoldAt = T.clock.t; lastName = n; }
  if (k === 'preset') hidden.clear();
  if (S.sel >= A(S).pieces.length) S.sel = A(S).pieces.length - 1;
  syncBar();
});

/* the view's toolbar: move or rotate, snap, reset */
const bar = h('div', { class: 'vbar', role: 'toolbar', 'aria-label': 'View tools' });
const bMove = h('button', { type: 'button', title: 'Move pieces (G)', onclick: () => { T.set('gmode', 'move'); T.commit('gmode'); } }, 'Move', h('kbd', {}, 'G'));
const bRot = h('button', { type: 'button', title: 'Rotate pieces (T)', onclick: () => { T.set('gmode', 'rotate'); T.commit('gmode'); } }, 'Rotate', h('kbd', {}, 'T'));
const bSnap = h('button', { type: 'button', title: 'Snap to half cells and 15° (Shift inverts while dragging)', onclick: () => { T.set('snap', !T.S.snap); T.commit('snap'); } }, 'Snap');
const bReset = h('button', { type: 'button', title: 'Reset the view (double-click empty space)', onclick: () => resetView() }, 'Reset view');
bar.append(bMove, bRot, h('i'), bSnap, bReset);
T.board.append(bar);
function syncBar() { bMove.setAttribute('aria-pressed', String(T.S.gmode === 'move')); bRot.setAttribute('aria-pressed', String(T.S.gmode === 'rotate')); bSnap.setAttribute('aria-pressed', String(!!T.S.snap)); bar.hidden = T.S.view === 'grid'; }
function resetView() { T.set('yaw', -20); T.set('tilt', 24); T.set('zoom', 0); T.commit('yaw'); }
syncBar();

/* scroll to zoom, double-click to reset */
T.canvas.addEventListener('wheel', e => {
  const r = T.canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * T.view.W, y = (e.clientY - r.top) / r.height * T.view.H;
  if (!inPrev(x, y)) return;
  e.preventDefault();
  const u = T.S.zoom === 0 ? fitU : T.S.zoom;
  T.set('zoom', Math.round(Math.max(1, Math.min(48, u * Math.exp(-e.deltaY * .0015))) * 2) / 2);
}, { passive: false });
T.canvas.addEventListener('dblclick', e => {
  const r = T.canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * T.view.W, y = (e.clientY - r.top) / r.height * T.view.H;
  if (inPrev(x, y) && pickAt(T.S, x, y) < 0 && !handleAt(x, y)) resetView();
});

/* keyboard: colours, brushes, handles, pieces, and a cell cursor */
T.canvas.tabIndex = 0; T.canvas.setAttribute('aria-label', 'Paper Pixel grid and 3D view. Arrows move the cell cursor, Enter paints, Backspace erases.');
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const S = T.S, k = e.key;
  if (/^[1-9]$/.test(k)) { const i = +k - 1; if (i < A(S).palette.length) { T.set('ink', i); if (S.brush !== 'fill') T.set('brush', 'paint'); } }
  else if (k === 'e' || k === 'E') T.set('brush', 'erase');
  else if (k === 'b' || k === 'B') T.set('brush', 'paint');
  else if (k === 'f' || k === 'F') T.set('brush', 'fill');
  else if (k === 'i' || k === 'I') T.set('brush', 'pick');
  else if (k === 'm' || k === 'M') { T.set('mirror', !S.mirror); T.commit('mirror'); }
  else if (k === 'g' || k === 'G') { T.set('gmode', 'move'); T.commit('gmode'); }
  else if (k === 't' || k === 'T') { T.set('gmode', 'rotate'); T.commit('gmode'); }
  else if (k === '[') T.set('sel', Math.max(0, S.sel - 1));
  else if (k === ']') T.set('sel', Math.min(A(S).pieces.length - 1, S.sel + 1));
  else if (document.activeElement === T.canvas && /^Arrow/.test(k)) {
    e.preventDefault(); const p = P(S), { w, h: hh } = PP.size(p);
    kcur.x = Math.max(0, Math.min(w - 1, kcur.x + (k === 'ArrowRight') - (k === 'ArrowLeft')));
    kcur.y = Math.max(0, Math.min(hh - 1, kcur.y + (k === 'ArrowDown') - (k === 'ArrowUp')));
    T.draw();
  }
  else if (document.activeElement === T.canvas && (k === 'Enter' || k === 'Backspace' || k === 'Delete')) {
    e.preventDefault(); const was = S.brush; if (k !== 'Enter') S.brush = 'erase'; paintAt(S, kcur.x, kcur.y); S.brush = was; T.commit('asset');
  }
});
</script>
