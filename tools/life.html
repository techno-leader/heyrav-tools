<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sea Life - heyrav tools</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css?v=b7e2e0c138">
</head>
<body>
<div class="tool">
  <aside class="rail" aria-label="Controls"></aside>
  <main class="stage"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kit.js?v=96f7f68aa7"></script>
<script src="water-sea.js?v=e44eb7571c"></script>
<script src="sea3d.js?v=140222a4a2"></script>
<script>
/* Sea Life - the Sunken world's scene in 3D, on a bench, over the same water
   the world draws. Dive: drag the gauge on the right, or let the camera scroll a
   page of the set length; hover to part the schools. Inspect: one creature on
   its own, turning, in the water of the depth it lives at. */

const offW = document.createElement('canvas'), water = WaterSea.create(offW), off3 = document.createElement('canvas');
const GAUGE = 64, WATER = Object.assign({}, WaterSea.DEFAULTS, { caustic: .05, window: .85 });
let sea = null, spec = null, specCv = document.createElement('canvas'), specKey = '', drag = false, whaleQ = false;
const LIVES = { school: 20, turtle: 18, manta: 55, whale: 120, lantern: 500, glowfish: 300, jelly: 700, squid: 800, siphon: 1500, angler: 2300, tripod: 4000, seapig: 4000, sponge: 4000, kelp: 15, rock: 150, basalt: 3600 };
const hx = v => 'rgb(' + v.map(q => Math.round(q * 255)).join(',') + ')';
function frame(ctx, W, H, t, S, ptr) {
  if (!sea) { sea = Sea3D.create(off3, { quality: S.quality }); }
  if (S.mode === 'dive') {
    const span = Math.min(1, (S.pages - 1) / 10), d = S.dive === 'auto' ? span * (.5 - .5 * Math.cos(t * .04)) : S.depth * span;
    const P = Object.assign({}, WATER, { depth: d }), w = Math.round(W * .5), h = Math.round(H * .5);
    if (water) { water.draw(P, t, w, h, null, []); ctx.drawImage(offW, 0, 0, W, H); }
    const z = WaterSea.zone(WATER, d), fog = z.top.map((c, i) => (c + z.bot[i]) / 2);
    sea.frame(t, { depth: d, range: [0, span], w: W - GAUGE, h: H, pointer: ptr && ptr.in && !drag ? [ptr.x, ptr.y] : null, fog, top: z.top, whales: whaleQ });
    whaleQ = false; ctx.drawImage(off3, 0, 0, W - GAUGE, H);
    const gx = W - GAUGE / 2, top = 30, bot = H - 60, m = Sea3D.metres(d);
    ctx.fillStyle = 'rgba(2,12,22,.3)'; ctx.fillRect(W - GAUGE, 0, GAUGE, H); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, top); ctx.lineTo(gx, bot); ctx.stroke();
    ctx.fillStyle = '#63f2d6'; ctx.beginPath(); ctx.arc(gx, top + (d / Math.max(.01, span)) * (bot - top), 7, 0, 7); ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '600 11px ui-monospace, Menlo, monospace'; ctx.fillText(Math.round(m).toLocaleString() + ' m', gx, bot + 24);
  } else {
    if (!spec || specKey !== S.creature) { spec && spec.dispose(); spec = Sea3D.specimens(); specCv = document.createElement('canvas'); specCv.style.cssText = 'position:absolute;left:-9999px;width:' + W + 'px;height:' + H + 'px'; document.body.append(specCv);
      const d = Sea3D.frac(LIVES[S.creature] || 50), z = WaterSea.zone(WATER, d); spec.add(S.creature, specCv, { top: z.top, deep: Math.min(1, d * 1.2) }); specKey = S.creature;
      spec.bg = [hx(z.top), hx(z.bot)]; }
    specCv.style.width = W + 'px'; specCv.style.height = H + 'px';
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, spec.bg[0]); g.addColorStop(1, spec.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const s = spec.list[0]; s.obj.rotation.y += S.turn * .01; spec.frame(t); ctx.drawImage(specCv, 0, 0, W, H);
  }
}
const T = Kit.tool({
  slug: 'sea-life', title: 'Sea Life',
  lede: 'The Sunken scene in 3D, after ABZÛ: walls of broken rock in fog, kelp, schools that flock, and every creature at the depth it lives at.',
  presets: { 'The dive': { mode: 'dive', dive: 'auto' }, 'Turtle': { mode: 'inspect', creature: 'turtle' }, 'Humpback': { mode: 'inspect', creature: 'whale' }, 'Anglerfish': { mode: 'inspect', creature: 'angler' }, 'Jellyfish': { mode: 'inspect', creature: 'jelly' } },
  groups: [
    { name: 'view', controls: [
      { k: 'mode', type: 'seg', label: 'mode', value: 'dive', options: [['dive', 'dive'], ['inspect', 'inspect a creature']], rand: false },
      { k: 'creature', type: 'select', label: 'creature', value: 'turtle', when: S => S.mode === 'inspect', options: Object.keys(LIVES).map(k => [k, k]) },
      { k: 'turn', type: 'range', label: 'turn', min: -2, max: 2, step: .05, value: .4, when: S => S.mode === 'inspect', rand: false },
    ]},
    { name: 'the dive', controls: [
      { k: 'dive', type: 'seg', label: 'camera', value: 'auto', options: [['auto', 'scroll the dive'], ['set', 'hold']], when: S => S.mode === 'dive', rand: false },
      { k: 'depth', type: 'range', label: 'how far down', min: 0, max: 1, step: .002, value: .02, when: S => S.mode === 'dive' && S.dive === 'set', rand: false },
      { k: 'pages', type: 'range', label: 'page length', min: 2, max: 14, step: 1, value: 11, unit: ' screens', when: S => S.mode === 'dive', help: 'Longer pages dive deeper; eleven screens reach the floor.', rand: false },
      { k: 'quality', type: 'range', label: 'quality', min: .4, max: 1, step: .1, value: 1, help: 'Fewer fish and plants at lower values, as on phones.', rand: false, nohash: true },
      { type: 'button', label: 'Send the humpbacks past', run: () => { whaleQ = true; } },
    ]},
    { name: 'export', controls: [
      { type: 'buttons', buttons: [{ label: 'PNG @2x', run: api => api.png(2) }, { label: 'Record 6s', run: api => api.record(6) }] },
      { type: 'button', label: 'Copy link to this state', run: api => api.link() },
    ]},
  ],
  draw: frame,
  onPointer(p, type, S) {
    const W = T.view.W, H = T.view.H; if (S.mode !== 'dive') return;
    if (type === 'down') drag = p.x > W - GAUGE;
    if (drag && p.down) { if (S.dive !== 'set') T.set('dive', 'set'); T.set('depth', Math.round(Math.max(0, Math.min(1, (p.y - 30) / (H - 90))) * 500) / 500); }
  },
});
addEventListener('pointerup', () => { if (drag) { T.commit('depth'); drag = false; } });
document.fonts.ready.then(() => T.draw());
</script>
</body>
</html>
